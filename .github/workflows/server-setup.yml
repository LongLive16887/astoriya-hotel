name: Server setup

# Looks at the server and, when deploy/config.env says SETUP_MODE=install, installs everything the
# site needs (its own Node.js, the service, backups, the web server config with HTTPS) and the
# current build. Other projects on the server are left alone. Runs when deploy/ changes, or by hand.
#
# Secrets (Settings → Secrets and variables → Actions), as in the owner's other projects:
# VPS_HOST, VPS_USER and VPS_SSH_KEY; or SERVER_SSH_PASSWORD with the root password.

on:
  push:
    branches: [main, claude/website-redesign-d2u64y]
    paths:
      - deploy/**
      - .github/workflows/server-setup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Connect to the server
        run: bash deploy/ci/connect.sh

      # The report may describe other projects on the server; it is printed encrypted.
      - name: Look at the server (read-only, encrypted report)
        run: |
          dir="$(server-put deploy/server/inspect.sh deploy/server/bootstrap.pub)"
          server-ssh "bash $dir/inspect.sh $dir/bootstrap.pub; rm -rf $dir"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build the site
        run: |
          . deploy/config.env
          if [ "${SETUP_MODE:-inspect}" != install ]; then echo "SETUP_MODE is not install: only looking."; exit 0; fi
          if [ -n "$DOMAIN" ]; then export VITE_SITE_URL="https://$DOMAIN"; fi
          npm ci
          npm run build
          npm run package

      - name: Install on the server
        run: |
          . deploy/config.env
          if [ "${SETUP_MODE:-inspect}" != install ]; then exit 0; fi
          dir="$(server-put deploy/server release/astoria-${{ github.sha }}.tar.gz)"
          server-ssh "DOMAIN='$DOMAIN' WWW='$WWW' WEB='${WEB:-}' ADMIN_EMAIL='$ADMIN_EMAIL' RELEASE='$dir/astoria-${{ github.sha }}.tar.gz' bash $dir/server/setup.sh; status=\$?; rm -rf $dir; exit \$status"

      - name: Check the site from outside
        run: |
          . deploy/config.env
          if [ "${SETUP_MODE:-inspect}" != install ]; then exit 0; fi
          if [ -z "$DOMAIN" ]; then
            # Other sites on the server may answer on its address, so only the site's own reply counts.
            host="$(printf '%s' "${VPS_HOST:-$SERVER_HOST}" | tr -d '[:space:]')"
            if curl -fsS --max-time 20 "http://$host/api/health" 2>/dev/null | grep -q '"version"'; then echo "The site answers on http://$host"
            else echo "::notice::The site is installed and running on the server. It is published once DOMAIN is set in deploy/config.env."; fi
            exit 0
          fi
          for i in $(seq 1 12); do
            curl -fsS --max-time 20 "https://$DOMAIN/api/health" && echo && exit 0
            echo "https://$DOMAIN does not answer yet, retrying…"
            sleep 10
          done
          curl -fsS --max-time 20 "http://$DOMAIN/api/health" && echo "::warning::$DOMAIN answers over HTTP only: the certificate is not issued yet (check the DNS A records, then run this workflow again)." && exit 0
          echo "::error::$DOMAIN does not answer. Check that its DNS A records point to the server."
          exit 1

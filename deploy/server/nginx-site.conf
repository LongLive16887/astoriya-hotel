    # Astoria hotel site (managed by deploy/server/setup.sh): files from the current build,
    # the API on 127.0.0.1:3001, uploaded photos from /var/lib/astoria/uploads.
    root /opt/astoria/current/dist;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-Sent Events for the admin panel must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /uploads/ {
        alias /var/lib/astoria/uploads/;
        include snippets/astoria-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Hashed build files never change; a missing one is a 404, not the page.
    location /assets/ {
        include snippets/astoria-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        include snippets/astoria-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include snippets/astoria-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
